<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout</title>

    <style>
        body{
            margin: 0;
            padding: 0;
        }
        header{
            padding: 1px;
            background-color: lightblue;
            color: white;
            text-align: center;
        }
        nav{
            background-color: grey;
            padding: 20px;
        }
        nav a{
            display: inline-block;
            color: white;
            text-decoration: none;
            padding: 2px;
            margin: 2px;
            
            font-size: larger;

        }
        main{
            display: flex;
            align-items: center;
        }
        main h1{
            text-align: center;
        }
        .div{
            width: 33%;
            height: 70%;
            margin: 10px;
            padding: 160px;
            border: 1px solid grey;
        }
        footer{
            background-color: yellowgreen;
            bottom: 0;
            position: fixed;
            width: 100%;
            height: 10%;
            text-align: center;
        }

    </style>
</head>
<body>
    <header>
        <h1>Hello World!</h1>
    </header> 
    <nav>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Services</a>
        <a href="">Contact Us</a>
    </nav>

    <main>
        <div class="div">
            <h1>Content</h1>
        </div>
        <div class="div">
            <h1>Content</h1>
        </div>
        <div class="div">
            <h1>Content</h1>
        </div>
    </main>

    <footer>
        <h1>Footer</h1>
    </footer>

</body>
</html>

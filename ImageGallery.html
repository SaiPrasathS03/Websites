<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        body{
            text-align: center;
            background: linear-gradient(to right, lightblue,darkblue);;
        }

        .gallery{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
        }
        img{
            width: 200px;
            height: 200px;
            margin: 10px;
            padding: 10px;
            border: 2px solid white;
            border-radius: 5px;
            object-fit: cover;
            transition: transform 0.1s ease;
        }
        .gallery img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <h1 class="title-bar" style="color: aliceblue; font-family:Arial, Helvetica, sans-serif;">Image Gallery</h1>
    <div class="gallery">
        <img src="https://images.ottplay.com/images/ms-dhoni-1743535361.jpg?impolicy=ottplay-202501_high&width=600" alt="">
        <img src="https://skillcircle.b-cdn.net/wp-content/uploads/2024/10/Virat-Kohli-1024x1024.jpg",alt="">
        <img src="https://th.bing.com/th/id/OIP.XyvI6hy6deqXcRfGo7O3HQHaE8?w=768&h=512&rs=1&pid=ImgDetMain" alt="">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBcNE6yFzhHMJWMx1e5-KDvUHnmfYjcJuyxQ&s" alt="">
        <img src="https://images.augustman.com/wp-content/uploads/sites/6/2024/03/01160931/401507128_844950213991268_5311943212388641599_n.jpg" alt="">
        <img src="https://img.mensxp.com/media/content/2024/Jan/7_659673bd256cf.jpeg?w=780&h=574&cc=1" alt="">

        <img src="https://cdn.thecricketpanda.com/wp-content/uploads/2024/09/Sachin-Tendulkar.jpg" alt="">
